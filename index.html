<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- スマホでの表示を整える設定 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>うたっこ(ミニ)</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    font-family: "Hiragino Maru Gothic ProN", "UD Digi Kyokasho", "Rounded Mplus 1c", sans-serif;
    background: linear-gradient(180deg, #fff6e5 0%, #ffe9f0 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    font-size: 24px;
    color: #ff7a59;
    margin: 8px 0 4px 0;
    text-align: center;
  }
  p.sub {
    font-size: 14px;
    color: #888;
    margin: 0 0 16px 0;
    text-align: center;
  }

  /* 画面(セクション)の切り替え。show クラスが付いたものだけ表示する */
  .screen { display: none; width: 100%; max-width: 480px; flex-direction: column; align-items: center; }
  .screen.show { display: flex; }

  /* ボタン共通(44px以上を必ず確保) */
  .big-btn {
    width: 100%;
    height: 76px;
    border: none;
    border-radius: 18px;
    font-size: 24px;
    font-weight: bold;
    color: #fff;
    background: #ff7a59;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    cursor: pointer;
    margin-bottom: 14px;
  }
  .mid-btn {
    width: 100%;
    height: 60px;
    border: none;
    border-radius: 16px;
    font-size: 19px;
    font-weight: bold;
    color: #fff;
    background: #54a0ff;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    cursor: pointer;
    margin-bottom: 12px;
  }
  .big-btn:active, .mid-btn:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 rgba(0,0,0,0.15);
  }
  .big-btn:disabled, .mid-btn:disabled {
    background: #d3d3d3;
    box-shadow: none;
  }

  /* お手本の3音を丸で表示するエリア */
  .notes-row {
    display: flex;
    gap: 14px;
    margin: 16px 0 24px 0;
  }
  .note-circle {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: bold;
    color: #fff;
    box-shadow: 0 4px 8px rgba(0,0,0,0.12);
    transition: transform 0.15s ease;
  }
  .note-circle.c0 { background: #ff6b6b; }
  .note-circle.c1 { background: #feca57; color: #7a5a00; }
  .note-circle.c2 { background: #1dd1a1; }
  /* 再生中の音は大きくふくらませて光らせる */
  .note-circle.playing {
    transform: scale(1.25);
    box-shadow: 0 0 20px rgba(255,200,80,0.8);
  }

  /* カウントダウンの特大数字 */
  .countdown {
    font-size: 130px;
    font-weight: bold;
    color: #ff7a59;
    min-height: 150px;
    line-height: 1;
    margin: 30px 0;
  }

  /* 録音中の音量の波(声が届いている安心表示) */
  .wave-area {
    width: 100%;
    height: 90px;
    background: #ffffff;
    border-radius: 18px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.08);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    margin: 12px 0 20px 0;
  }
  .wave-bar {
    width: 10px;
    height: 8px;
    border-radius: 5px;
    background: linear-gradient(180deg, #48dbfb, #1dd1a1);
    transition: height 0.06s linear;
  }

  /* 結果画面 */
  .score-big {
    font-size: 88px;
    font-weight: bold;
    color: #ff9f43;
    line-height: 1.1;
    margin: 8px 0;
  }
  .score-unit { font-size: 36px; }
  .celebrate {
    font-size: 44px;
    min-height: 54px;
    margin-bottom: 6px;
  }
  .feedback-box {
    width: 100%;
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    padding: 16px;
    margin-bottom: 14px;
    font-size: 18px;
    line-height: 1.6;
    color: #555;
  }
  .feedback-box .label {
    font-size: 14px;
    color: #ff9f43;
    font-weight: bold;
    display: block;
    margin-bottom: 4px;
  }

  /* 音ごとの星表示(結果画面) */
  .note-stars {
    display: flex;
    gap: 12px;
    margin: 4px 0 16px 0;
  }
  .note-star-item {
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
    padding: 10px 14px;
    text-align: center;
    font-size: 17px;
    font-weight: bold;
    color: #666;
  }
  .note-star-item .star { font-size: 26px; display: block; }

  .status {
    width: 100%;
    text-align: center;
    font-size: 15px;
    color: #555;
    background: #ffffffaa;
    border-radius: 12px;
    padding: 12px;
    min-height: 44px;
  }
  .status.error { background: #fff3e0; color: #b06000; }

  .guide-text {
    font-size: 20px;
    color: #666;
    margin: 4px 0 10px 0;
    text-align: center;
    font-weight: bold;
  }
</style>
</head>
<body>

  <h1>うたっこ(ミニ)</h1>
  <p class="sub">ド・レ・ミを きいて うたってみよう</p>

  <!-- ========== 画面1:スタート(お手本を聞く) ========== -->
  <div class="screen show" id="screenStart">
    <div class="notes-row">
      <div class="note-circle c0" id="noteC0">ド</div>
      <div class="note-circle c1" id="noteC1">レ</div>
      <div class="note-circle c2" id="noteC2">ミ</div>
    </div>
    <button class="mid-btn" id="listenBtn">▶️ きく</button>
    <button class="big-btn" id="singBtn">🎤 うたってみる</button>
    <div class="status" id="startStatus">まずは おてほんを きいてみよう</div>
  </div>

  <!-- ========== 画面2:カウントダウン ========== -->
  <div class="screen" id="screenCountdown">
    <div class="guide-text">じゅんびして…</div>
    <div class="countdown" id="countdownNum">3</div>
  </div>

  <!-- ========== 画面3:録音中 ========== -->
  <div class="screen" id="screenRecording">
    <div class="guide-text">うたって!</div>
    <!-- カラオケ風ガイド:今うたう音の丸が大きく光る(判定はしない。道しるべだけ) -->
    <div class="notes-row">
      <div class="note-circle c0" id="recNote0">ド</div>
      <div class="note-circle c1" id="recNote1">レ</div>
      <div class="note-circle c2" id="recNote2">ミ</div>
    </div>
    <div class="wave-area" id="waveArea"></div>
    <div class="status">こえが とどいてるよ</div>
  </div>

  <!-- ========== 画面4:採点結果 ========== -->
  <div class="screen" id="screenResult">
    <div class="celebrate" id="celebrateEmoji"></div>
    <div class="score-big"><span id="scoreNum">0</span><span class="score-unit">てん</span></div>
    <!-- 音ごとの結果(⭐=ばっちり、☆=おしい)。どの音を直せばいいか一目で分かる -->
    <div class="note-stars" id="noteStars"></div>
    <div class="feedback-box">
      <span class="label">🌟 よかったところ</span>
      <span id="goodPoint"></span>
    </div>
    <div class="feedback-box">
      <span class="label">🎯 つぎの ちょうせん</span>
      <span id="nextPoint"></span>
    </div>
    <button class="big-btn" id="retryBtn">🎤 もういちど うたう</button>
    <button class="mid-btn" id="backBtn">おてほんを きく</button>
  </div>

<script type="module">
/* =========================================================
   うたっこ(ミニ)工程3:聞く → 歌う → 採点 の縦切りMVP
   ・お手本:ド(262Hz)レ(294Hz)ミ(330Hz)を各1秒、ピアノ風電子音で再生
   ・録音:3秒間。ピッチ(声の高さ)を記録し続ける
   ・採点:録音を3等分し、区間ごとの平均ピッチをお手本と比較
   ・録音音声は端末内でのみ処理。外部送信は一切しない
   ========================================================= */

// ---------- Pitchy(ピッチ解析ライブラリ)の読み込み。失敗したら自前の自己相関法に切り替え ----------
let PitchDetector = null;
let usingFallback = false;
try {
  const pitchyModule = await import("https://esm.sh/pitchy@4");
  PitchDetector = pitchyModule.PitchDetector;
} catch (e) {
  usingFallback = true;
  console.log("Pitchy読み込み失敗。自己相関法(自前実装)を使います", e);
}

// ---------- お手本の設定 ----------
// ド・レ・ミの周波数(Hz)。設計書の数値どおり
const TARGET_NOTES = [
  { name: "ド", freq: 261.63 },
  { name: "レ", freq: 293.66 },
  { name: "ミ", freq: 329.63 }
];
const NOTE_DURATION = 1.0;   // お手本1音の長さ(秒)
const RECORD_SECONDS = 3.0;  // 録音時間(秒)= 3音ぶん

// ---------- 解析まわりの設定(工程2と同じ) ----------
const MIN_FREQ = 70;    // 検出する声の下限(大人の低い声)
const MAX_FREQ = 1050;  // 検出する声の上限(子どもの高い声)
const VOLUME_THRESHOLD = 0.015;  // これ未満の音量は無音とみなす(0.01=雑音を拾いすぎ、0.02=声を逃しすぎ、の中間に調整)
const CLARITY_THRESHOLD = 0.85;  // Pitchyの「確からしさ」の合格ライン

// ---------- 画面の部品 ----------
const screens = {
  start: document.getElementById("screenStart"),
  countdown: document.getElementById("screenCountdown"),
  recording: document.getElementById("screenRecording"),
  result: document.getElementById("screenResult")
};
const listenBtn = document.getElementById("listenBtn");
const singBtn = document.getElementById("singBtn");
const retryBtn = document.getElementById("retryBtn");
const backBtn = document.getElementById("backBtn");
const startStatus = document.getElementById("startStatus");
const countdownNum = document.getElementById("countdownNum");
const noteCircles = [
  document.getElementById("noteC0"),
  document.getElementById("noteC1"),
  document.getElementById("noteC2")
];
const waveArea = document.getElementById("waveArea");
const scoreNum = document.getElementById("scoreNum");
const celebrateEmoji = document.getElementById("celebrateEmoji");
const goodPoint = document.getElementById("goodPoint");
const nextPoint = document.getElementById("nextPoint");

// 録音中の音量の波バー(15本)をあらかじめ作っておく
const WAVE_BAR_COUNT = 15;
const waveBars = [];
for (let i = 0; i < WAVE_BAR_COUNT; i++) {
  const bar = document.createElement("div");
  bar.className = "wave-bar";
  waveArea.appendChild(bar);
  waveBars.push(bar);
}

// ---------- 状態を持つ変数 ----------
let audioContext = null;
let analyserNode = null;
let mediaStream = null;
let detector = null;
let inputBuffer = null;
let animationId = null;
let isRecording = false;
let recordStartTime = 0;
// 録音中に集めるピッチの記録。{ time: 録音開始からの秒数, freq: 周波数 } の配列
let pitchSamples = [];

// ---------- 画面切り替え ----------
function showScreen(name) {
  Object.values(screens).forEach(s => s.classList.remove("show"));
  screens[name].classList.add("show");
}

// ---------- AudioContext(音の装置)の準備。必ずタップの中で呼ぶ(iPhone対策) ----------
function ensureAudioContext() {
  if (!audioContext) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    audioContext = new AudioContextClass();
  }
  if (audioContext.state === "suspended") {
    audioContext.resume();
  }
  return audioContext;
}

// ---------- ピアノ風の音を1つ鳴らす(工程1と同じ仕組み) ----------
function playPianoNote(frequency, duration, when) {
  const ctx = ensureAudioContext();
  const startTime = when !== undefined ? when : ctx.currentTime;

  // 基音+倍音を混ぜてピアノらしい音色にする
  const harmonics = [
    { multiple: 1, gain: 1.0 },
    { multiple: 2, gain: 0.25 },
    { multiple: 3, gain: 0.12 }
  ];

  const masterGain = ctx.createGain();
  masterGain.connect(ctx.destination);
  const peakGain = 0.35;
  masterGain.gain.setValueAtTime(0, startTime);
  masterGain.gain.linearRampToValueAtTime(peakGain, startTime + 0.005);
  masterGain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

  harmonics.forEach(h => {
    const osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(frequency * h.multiple, startTime);
    const g = ctx.createGain();
    g.gain.setValueAtTime(h.gain, startTime);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.05);
  });
}

// ---------- お手本再生(ド→レ→ミを1秒ずつ。丸も一緒に光らせる) ----------
let isPlayingExample = false;

listenBtn.addEventListener("click", () => {
  if (isPlayingExample) return; // 再生中の二重押し防止
  const ctx = ensureAudioContext();
  isPlayingExample = true;
  listenBtn.disabled = true;
  singBtn.disabled = true;
  startStatus.textContent = "おてほんを ならすよ";

  // Web Audio APIの時刻指定で正確に1秒ごとに予約する
  // (setTimeoutより音のタイミングが正確。工程1レビューでの宿題に対応)
  const startTime = ctx.currentTime + 0.1;
  TARGET_NOTES.forEach((note, i) => {
    playPianoNote(note.freq, NOTE_DURATION * 0.95, startTime + i * NOTE_DURATION);
  });

  // 丸を光らせる演出は見た目用なのでsetTimeoutで十分
  TARGET_NOTES.forEach((note, i) => {
    setTimeout(() => {
      noteCircles.forEach(c => c.classList.remove("playing"));
      noteCircles[i].classList.add("playing");
    }, 100 + i * NOTE_DURATION * 1000);
  });

  // 再生終了後に元へ戻す
  setTimeout(() => {
    noteCircles.forEach(c => c.classList.remove("playing"));
    isPlayingExample = false;
    listenBtn.disabled = false;
    singBtn.disabled = false;
    startStatus.textContent = "おなじように うたってみよう!";
  }, 100 + TARGET_NOTES.length * NOTE_DURATION * 1000);
});

// ---------- 「うたってみる」:マイク準備 → カウントダウン → 録音 ----------
singBtn.addEventListener("click", async () => {
  try {
    ensureAudioContext();
    startStatus.classList.remove("error");
    startStatus.textContent = "マイクの じゅんびちゅう…";

    // マイクの許可を求める(すでに許可済みならすぐ通る)
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });

    const source = audioContext.createMediaStreamSource(mediaStream);
    analyserNode = audioContext.createAnalyser();
    analyserNode.fftSize = 2048;
    source.connect(analyserNode);
    inputBuffer = new Float32Array(analyserNode.fftSize);
    if (PitchDetector) {
      detector = PitchDetector.forFloat32Array(analyserNode.fftSize);
    }

    // カウントダウン開始
    showScreen("countdown");
    runCountdown(3);
  } catch (err) {
    console.log("マイクエラー:", err);
    startStatus.classList.add("error");
    if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError") {
      startStatus.textContent = "マイクが つかえなかったよ。ブラウザの せっていで マイクを「きょか」に してね";
    } else {
      startStatus.textContent = "マイクの じゅんびで こまったことが おきたよ。ページを ひらきなおして ためしてね";
    }
  }
});

// ---------- カウントダウン(3→2→1→スタート) ----------
function runCountdown(from) {
  let count = from;
  countdownNum.textContent = count;
  // カウントに合わせてポン、と軽い音を鳴らす(準備の合図)
  playPianoNote(660, 0.15);

  const timer = setInterval(() => {
    count--;
    if (count > 0) {
      countdownNum.textContent = count;
      playPianoNote(660, 0.15);
    } else {
      clearInterval(timer);
      countdownNum.textContent = "🎵";
      playPianoNote(880, 0.3); // スタートの合図は少し高い音
      startRecording();
    }
  }, 1000);
}

// ---------- 録音開始(3秒間ピッチを記録) ----------
const recNotes = [
  document.getElementById("recNote0"),
  document.getElementById("recNote1"),
  document.getElementById("recNote2")
];

function startRecording() {
  showScreen("recording");
  pitchSamples = [];
  isRecording = true;
  recordStartTime = audioContext.currentTime;
  recordLoop();

  // カラオケ風ガイド:1秒ごとに「今うたう音」の丸を大きく光らせる
  // (音程の判定はしない。タイミングの道しるべだけ)
  recNotes.forEach(c => c.classList.remove("playing"));
  recNotes[0].classList.add("playing"); // 最初はドから
  for (let i = 1; i < 3; i++) {
    setTimeout(() => {
      if (!isRecording) return; // すでに録音が終わっていたら何もしない
      recNotes.forEach(c => c.classList.remove("playing"));
      recNotes[i].classList.add("playing");
    }, i * 1000);
  }

  // 3秒たったら自動で止める
  setTimeout(() => {
    stopRecording();
  }, RECORD_SECONDS * 1000);
}

// ---------- 録音中のループ(ピッチ記録+音量の波表示) ----------
function recordLoop() {
  if (!isRecording) return;

  analyserNode.getFloatTimeDomainData(inputBuffer);

  // 音量(RMS)を計算
  let rms = 0;
  for (let i = 0; i < inputBuffer.length; i++) rms += inputBuffer[i] * inputBuffer[i];
  rms = Math.sqrt(rms / inputBuffer.length);

  // 音量の波の表示を更新(中央が高くなる山型でランダムに揺らして「生きてる感」を出す)
  const level = Math.min(rms * 1200, 100);
  waveBars.forEach((bar, i) => {
    const centerBoost = 1 - Math.abs(i - WAVE_BAR_COUNT / 2) / (WAVE_BAR_COUNT / 2) * 0.5;
    const h = 8 + level * 0.7 * centerBoost * (0.7 + Math.random() * 0.3);
    bar.style.height = Math.min(h, 80) + "px";
  });

  // ピッチを解析して記録
  if (rms >= VOLUME_THRESHOLD) {
    let freq = -1, clarity = 0;
    if (detector) {
      const [f, c] = detector.findPitch(inputBuffer, audioContext.sampleRate);
      freq = f; clarity = c;
    } else {
      const result = autoCorrelate(inputBuffer, audioContext.sampleRate);
      freq = result.freq; clarity = result.clarity;
    }
    if (freq > 0 && clarity >= CLARITY_THRESHOLD && freq >= MIN_FREQ && freq <= MAX_FREQ) {
      pitchSamples.push({
        time: audioContext.currentTime - recordStartTime,
        freq: freq
      });
    }
  }

  animationId = requestAnimationFrame(recordLoop);
}

// ---------- 録音停止 → 採点へ ----------
function stopRecording() {
  isRecording = false;
  if (animationId) cancelAnimationFrame(animationId);

  // マイクを完全に止める(使用中マークも消える)
  if (mediaStream) {
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }

  // 採点して結果画面へ
  const result = calculateScore(pitchSamples);
  showResult(result);
}

// ---------- 自己相関法(Pitchyの予備。工程2と同じ) ----------
function autoCorrelate(buffer, sampleRate) {
  const n = buffer.length;
  let rms = 0;
  for (let i = 0; i < n; i++) rms += buffer[i] * buffer[i];
  rms = Math.sqrt(rms / n);
  if (rms < VOLUME_THRESHOLD) return { freq: -1, clarity: 0 };

  const minLag = Math.floor(sampleRate / MAX_FREQ);
  const maxLag = Math.floor(sampleRate / MIN_FREQ);
  let bestLag = -1, bestCorrelation = 0;
  for (let lag = minLag; lag <= maxLag && lag < n; lag++) {
    let correlation = 0;
    for (let i = 0; i < n - lag; i++) correlation += buffer[i] * buffer[i + lag];
    correlation /= (n - lag);
    if (correlation > bestCorrelation) { bestCorrelation = correlation; bestLag = lag; }
  }
  if (bestLag === -1) return { freq: -1, clarity: 0 };
  return { freq: sampleRate / bestLag, clarity: Math.min(bestCorrelation / (rms * rms), 1) };
}

// ---------- 採点 ----------
// 音の高さの比較には「セント」という単位を使う。
// 100セント=半音。人の耳の感覚に合った比べ方ができる
function freqToCentsDiff(freq, targetFreq) {
  let cents = 1200 * Math.log2(freq / targetFreq);
  // 1オクターブ(1200セント)ちょうど上下のズレは「同じ音」とみなして折りたたむ。
  // 子どもは自然に1オクターブ上で歌うことが多く、それを減点しないための処理
  while (cents > 600) cents -= 1200;
  while (cents < -600) cents += 1200;
  return cents;
}

function calculateScore(samples) {
  // 声がじゅうぶん録れていなかった場合は採点しない。
  // 【調整メモ】10個=雑音でも点が出てしまう/40個=小さめの歌声まで「--」になってしまう。
  // 中間の25個(3秒中およそ0.4秒ぶんの声)を基準にする
  if (samples.length < 25) {
    return { noVoice: true };
  }

  // 録音3秒を3等分し、各区間のサンプルを分ける
  const segments = [[], [], []];
  samples.forEach(s => {
    let idx = Math.floor(s.time / (RECORD_SECONDS / 3));
    if (idx > 2) idx = 2;
    segments[idx].push(s.freq);
  });

  // 区間ごとの音程点とズレ(セント)を計算
  const segmentResults = segments.map((segFreqs, i) => {
    if (segFreqs.length < 3) {
      // その区間に声がほぼない場合。0点にはせず「ひかえめな点」にする(甘め採点)
      return { score: 40, centsDiff: null, avgFreq: null };
    }
    const avgFreq = segFreqs.reduce((a, b) => a + b, 0) / segFreqs.length;
    const centsDiff = freqToCentsDiff(avgFreq, TARGET_NOTES[i].freq);
    const absDiff = Math.abs(centsDiff);

    // 半音以内(100セント)=満点/1音以内(200セント)=半分/それ以上=低め
    // 甘め調整:境界を少し広げ(120/260)、「半分」も60点、「低め」も35点にする
    let score;
    if (absDiff <= 120) score = 100;
    else if (absDiff <= 260) score = 60;
    else score = 35;
    return { score, centsDiff, avgFreq };
  });

  // 音程点=3区間の平均
  const pitchScore = segmentResults.reduce((a, r) => a + r.score, 0) / 3;

  // 安定性:全サンプルのピッチのブレ幅(標準偏差)をセント単位で計算
  const allCents = samples.map(s => 1200 * Math.log2(s.freq / TARGET_NOTES[0].freq));
  const mean = allCents.reduce((a, b) => a + b, 0) / allCents.length;
  const variance = allCents.reduce((a, c) => a + (c - mean) * (c - mean), 0) / allCents.length;
  const stdDev = Math.sqrt(variance);
  // 注意:ド→レ→ミと音が変わること自体でブレ幅は大きくなるので、
  // その分(メロディーの動きぶん)を差し引いた基準で甘めに判定する
  // stdDev 180セント以下なら満点、そこから緩やかに下げ、最低でも40点
  let stabilityScore;
  if (stdDev <= 180) stabilityScore = 100;
  else if (stdDev <= 400) stabilityScore = 100 - (stdDev - 180) * (60 / 220);
  else stabilityScore = 40;

  // 総合点 = 音程70% + 安定性30%
  const total = Math.round(pitchScore * 0.7 + stabilityScore * 0.3);

  return {
    noVoice: false,
    total,
    pitchScore: Math.round(pitchScore),
    stabilityScore: Math.round(stabilityScore),
    segmentResults,
    stdDev
  };
}

// ---------- フィードバック文の生成(良い点1つ+次の挑戦1つ。否定語は使わない) ----------
function makeFeedback(result) {
  const segs = result.segmentResults;
  const noteNames = ["さいしょの ド", "まんなかの レ", "さいごの ミ"];

  // 「よかったところ」:一番点が高かった区間をほめる
  let bestIdx = 0;
  segs.forEach((s, i) => { if (s.score > segs[bestIdx].score) bestIdx = i; });
  let good;
  if (segs.every(s => s.score === 100)) {
    good = "ぜんぶの おとが ばっちり あってたよ!すごい!";
  } else if (segs[bestIdx].score >= 100) {
    good = noteNames[bestIdx] + "の おとが とっても よかったよ!";
  } else if (result.stabilityScore >= 80) {
    good = "こえが ぶれずに あんていして いたよ!";
  } else {
    good = "さいごまで しっかり こえが だせたよ!";
  }

  // 「つぎのちょうせん」:一番ズレていた区間を1つだけ、方向つきで(前向きな言い方)
  let worstIdx = 0;
  segs.forEach((s, i) => { if (s.score < segs[worstIdx].score) worstIdx = i; });
  let next;
  if (segs.every(s => s.score === 100)) {
    next = "こんどは もっと ながく のばして うたってみよう!";
  } else if (segs[worstIdx].centsDiff === null) {
    next = noteNames[worstIdx] + "でも こえを だしてみよう!";
  } else if (segs[worstIdx].centsDiff < 0) {
    next = noteNames[worstIdx] + "を もうすこし たかく してみよう!";
  } else {
    next = noteNames[worstIdx] + "を もうすこし ひくく してみよう!";
  }

  return { good, next };
}

// ---------- 結果表示 ----------
const noteStarsArea = document.getElementById("noteStars");

function showResult(result) {
  showScreen("result");
  noteStarsArea.innerHTML = ""; // 前回の星表示をリセット

  if (result.noVoice) {
    // 声が録れていなかった場合。責めずに、やり方をやさしく案内する
    celebrateEmoji.textContent = "🎤";
    scoreNum.textContent = "--";
    goodPoint.textContent = "ちょうせん できたね!";
    nextPoint.textContent = "こえが とどかなかったみたい。マイクに ちかづいて、おてほんと おなじ たかさで「ドードー・レーレー・ミーミー」と うたってみよう!";
    return;
  }

  // 総合点の表示と演出(60点以上でお祝い。それ未満でも拍手=否定しない)
  scoreNum.textContent = result.total;
  celebrateEmoji.textContent = result.total >= 60 ? "🎉✨🎊" : "👏😊";

  // 音ごとの星表示:⭐=ばっちり(満点)、☆=おしい(あと少し)
  // ×や赤は使わない。「おしい」も星の仲間として見せる
  const noteNamesShort = ["ド", "レ", "ミ"];
  result.segmentResults.forEach((seg, i) => {
    const item = document.createElement("div");
    item.className = "note-star-item";
    const star = seg.score >= 100 ? "⭐" : "☆";
    item.innerHTML = '<span class="star">' + star + '</span>' + noteNamesShort[i];
    noteStarsArea.appendChild(item);
  });

  const fb = makeFeedback(result);
  goodPoint.textContent = fb.good;
  nextPoint.textContent = fb.next;
}

// ---------- 結果画面のボタン ----------
// もういちど歌う:スタート画面に戻してから、自動で「うたってみる」と同じ流れを始める
retryBtn.addEventListener("click", () => {
  showScreen("start");
  // 画面が切り替わるのを少しだけ待ってから録音の流れへ
  setTimeout(() => singBtn.click(), 100);
});

backBtn.addEventListener("click", () => {
  showScreen("start");
  startStatus.textContent = "まずは おてほんを きいてみよう";
});
</script>
